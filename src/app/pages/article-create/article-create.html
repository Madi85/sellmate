<div class="page-header">
  <div>
    <h1>{{ t('createArticleTitle') }}</h1>
    <p>{{ t('createArticleSubtitle') }}</p>
  </div>
</div>

<div class="field">
  <label>{{ t('photos') }}</label>

  <label class="image-upload">
    <span>{{ t('selectPhotos') }}</span>

    <input type="file" accept="image/*" multiple (change)="onImagesSelected($event)" />
  </label>

  <small>
    {{ t('photoHint') }}
  </small>
</div>

@if (selectedImages.length > 0) {

<div class="image-preview-grid">

  @for (
  image of selectedImages;
  track image.previewUrl;
  let i = $index
  ) {

  <div class="image-preview">

    <img [src]="image.previewUrl" [alt]="t('articleImageAlt')" />

    @if (i === 0) {
    <span class="cover-badge">
      {{ t('coverImage') }}
    </span>
    }

    <button type="button" class="remove-image" (click)="removeImage(i)">
      ×
    </button>

  </div>
  }

</div>
}

<div class="article-form-card">

  <form (ngSubmit)="saveArticle()">

    <div class="field">
      <label for="title">
        {{ t('title') }} *
      </label>

      <input id="title" name="title" type="text" [(ngModel)]="title" [placeholder]="t('titlePlaceholder')" />
    </div>

    <div class="field">
      <label for="description">
        {{ t('description') }}
      </label>

      <textarea id="description" name="description" [(ngModel)]="description" rows="5"
        [placeholder]="t('descriptionPlaceholder')"></textarea>
    </div>

    <div class="form-row">

      <div class="field">
        <label for="category">
          {{ t('category') }}
        </label>

        <select [(ngModel)]="category" name="category">
          <option [ngValue]="''">
            {{ t('pleaseSelect') }}
          </option>

          @for (category of categories; track category) {
          <option [ngValue]="category">
            {{ t('category' + category.charAt(0).toUpperCase() + category.slice(1)) }}
          </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="condition">
          {{ t('condition') }}
        </label>

        <select [(ngModel)]="condition" name="condition">
          <option [ngValue]="''">
            {{ t('pleaseSelect') }}
          </option>

          @for (condition of conditions; track condition) {
          <option [ngValue]="condition">
            {{ t('condition' + condition
            .split('_')
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join('')) }}
          </option>
          }
        </select>
      </div>

    </div>

    <div class="form-row">

      <div class="field">
        <label for="brand">
          {{ t('brand') }}
        </label>

        <input id="brand" name="brand" type="text" [(ngModel)]="brand" [placeholder]="t('brandPlaceholder')" />
      </div>

      <div class="field">
        <label for="size">
          {{ t('size') }}
        </label>

        <input id="size" name="size" type="text" [(ngModel)]="size" [placeholder]="t('sizePlaceholder')" />
      </div>

    </div>

    <div class="field">
      <label for="purchasePrice">
        {{ t('purchasePrice') }}
      </label>

      <input id="purchasePrice" name="purchasePrice" type="number" min="0" step="0.01" [(ngModel)]="purchasePrice"
        placeholder="0,00" />
    </div>

    @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
    }

    <div class="actions">
      <button type="button" class="secondary" (click)="cancel()">
        {{ t('cancel') }}
      </button>

      <button type="submit" class="primary" [disabled]="loading">
        {{ loading ? t('saving') : t('saveArticle') }}
      </button>
    </div>

  </form>

</div>
