<div class="auth-page">
  <div class="auth-card">
    <h1>SellMate</h1>
    <h2>Konto erstellen</h2>

    <form (ngSubmit)="register()">
      <label for="displayName">Name</label>
      <input
        id="displayName"
        type="text"
        name="displayName"
        [(ngModel)]="displayName"
        autocomplete="name"
      />

      <label for="email">E-Mail</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
      />

      <label for="password">Passwort</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="new-password"
      />

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      @if (successMessage) {
        <p class="success">{{ successMessage }}</p>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Wird erstellt...' : 'Registrieren' }}
      </button>
    </form>

    <p>
      Bereits registriert?
      <a routerLink="/login">Anmelden</a>
    </p>
  </div>
</div>
